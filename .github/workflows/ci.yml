name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元/Robolectric 面 + 架构门禁 + lint。设备面不在这里跑:
  # 那 136 个插桩用例需要 root + Magisk + LSPosed/Vector 的真实环境,
  # 由 scripts/test-integration/run-acceptance.ps1 在维护者设备上执行。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Acceptance gates must be reproducible from source
        run: echo "GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx3072m" >> $GITHUB_ENV

      - name: Unit tests (Room / Robolectric / architecture gates)
        # --no-build-cache 是刻意的:本仓曾因构建缓存交出跨产物 ABI 不一致的陈旧 dex,
        # 只在设备运行期炸。可复现优先于快。
        run: ./gradlew :app:testModernDebugUnitTest --no-build-cache --stacktrace

      - name: Instrumented source set must compile
        # 这是一个真实的回归位:退役一个类别时漏 grep androidTest 的引用面,
        # 只有这一步会当场红(JVM 单测看不见 androidTest)。
        run: ./gradlew :app:compileModernDebugAndroidTestKotlin --no-build-cache

      - name: Lint (baseline 43 warnings / 0 errors — no new warnings)
        run: ./gradlew :app:lintModernRelease --no-build-cache

      - name: Both framework variants must assemble
        run: ./gradlew :app:assembleModernRelease :app:assembleLegacyRelease --no-build-cache

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
